[project]
name = "transaction analysis application"
version = "0.1.0"
description = "Приложение будет генерировать JSON-данные для веб-страниц, формировать Excel-отчеты, а также предоставлять другие сервисы"
authors = [
    {name = "даша рамзер",email = "kda2000.123@yandex.ru"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
check_untyped_defs = true
strict = true
warn_unreachable = true


[tool.black]
line-length = 119
exclude = ".git"


[tool.isort]
line_length = 119
